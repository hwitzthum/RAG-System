name: Supabase Deploy Credential Check

# Proves that migrations *could* deploy, without waiting for one to need to.
#
# The apply workflow (supabase-migrations.yml) only triggers on changes under
# supabase/migrations/, so nothing exercises the deploy credentials between
# migration PRs. SUPABASE_DB_PASSWORD went stale sometime after 2026-07-14 and
# that stayed invisible until a merge on 2026-08-04 needed it — three weeks in
# which any migration would have silently failed to deploy. This runs the same
# path on a schedule so the next expiry surfaces within a day.
#
# `db push --dry-run` is deliberate rather than a bare connection test: it
# performs the real link, the real authenticated connection, and the real
# comparison of local migration files against the remote history table, then
# stops before applying anything. That covers both ways this has broken —
# expired credentials, and remote history containing versions with no local
# file (which makes the real push abort).
#
# Note: GitHub disables scheduled workflows after 60 days without repository
# activity. If this stops reporting entirely, re-enable it in the Actions tab
# rather than assuming it is passing.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  # Catch migration-history drift while it is still cheap to fix, instead of
  # discovering it after the merge commit is already on main.
  pull_request:
    paths:
      - "supabase/migrations/**"

permissions:
  contents: read

# Shared with supabase-migrations.yml so a check can never run against the
# database while an apply is in flight.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  check-deploy-path:
    runs-on: ubuntu-latest
    # Pull requests from forks do not receive secrets, so the check would fail
    # for reasons that tell us nothing about the credentials.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: aaghjfmstezmxyxyrfri
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.0

      # Exercises SUPABASE_ACCESS_TOKEN. This token expires independently of the
      # database password, and fails here rather than at the push step.
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Exercises SUPABASE_DB_PASSWORD and the local-vs-remote migration
      # history comparison. Applies nothing.
      - name: Verify migrations could be applied
        run: supabase db push --dry-run
