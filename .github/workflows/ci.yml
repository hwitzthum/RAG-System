name: CI

# Runs the same quality/security gate documented in package.json ("npm run
# check", "npm run build", "npm run test:security", "npm run infra:check-env")
# on every pull request. Previously none of these were enforced by CI — the
# only check that ran automatically on a PR was the Vercel preview build
# comment, which does not run lint, typecheck, the 180+ test:security suite,
# or the scripts/infrastructure/validate-env.mjs schema. A regression in any
# previously-hardened area (rate limiting, CSRF, tenant scoping, prompt
# injection, output filtering, etc.) could merge silently as long as the PR
# author's self-reported local run "looked" green.
#
# All environment values below are non-secret placeholders used only to
# satisfy lib/config/env.ts's Zod schema shape at build time (Next.js
# statically imports route modules during "next build" / page-data
# collection, so every required key must resolve even though no external
# API is ever actually called during a build). No real credentials are
# used or required for this workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # NODE_ENV is deliberately NOT set at the workflow/job level: npm treats
  # NODE_ENV=production as "skip devDependencies" during install, which would
  # make `npm ci` omit eslint/typescript and break every job below (found by
  # running this workflow — the first version set it globally and both
  # "npm run check" and "npm run build" failed with "eslint: not found" /
  # "Cannot find module 'typescript'" because devDependencies were never
  # installed). It's set instead as a step-level override, after `npm ci`,
  # only on the steps that specifically need production-mode env validation.
  NEXT_PUBLIC_APP_NAME: RAG System
  NEXT_PUBLIC_APP_URL: http://localhost:3001
  INGESTION_BATCH_SIZE: "50"
  INGESTION_LOCK_TIMEOUT_SECONDS: "900"
  CRON_SECRET: ci-placeholder-cron-secret-not-a-real-secret-value
  SUPABASE_URL: https://ci-placeholder-project.supabase.co
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder-project.supabase.co
  SUPABASE_ANON_KEY: ci-placeholder-anon-key
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
  SUPABASE_JWT_SECRET: ci-placeholder-jwt-secret
  AUTH_DEV_INSECURE_BYPASS: "false"
  AUTH_RATE_LIMIT_WINDOW_SECONDS: "60"
  AUTH_RATE_LIMIT_MAX_REQUESTS: "30"
  OPENAI_API_KEY: sk-ci-placeholder-openai-key-not-a-real-secret
  OPENAI_BYOK_VAULT_KEY: "JuZQrKP96HW5mHFlwwTC7OowhkR74fAjTOEFDLbBPa0="
  OPENAI_BYOK_VAULT_KEY_VERSION: "1"
  RAG_QUERY_EMBEDDING_MODEL: text-embedding-3-large
  RAG_QUERY_EMBEDDING_DIMENSIONS: "1024"
  RAG_RETRIEVAL_VERSION: "1"
  RAG_RRF_K: "60"
  RAG_RERANK_POOL_SIZE: "100"
  RAG_LLM_MODEL: gpt-4o-mini
  RAG_LLM_MAX_OUTPUT_TOKENS: "2000"
  RAG_MIN_EVIDENCE_CHUNKS: "2"
  RAG_MIN_RERANK_SCORE: "0.25"
  RAG_MIN_HEURISTIC_RELEVANCE: "0.14"
  RAG_DEFAULT_TOP_K: "8"
  RAG_CACHE_TTL_SECONDS: "86400"
  RAG_MAX_UPLOAD_BYTES: "52428800"
  RAG_STORAGE_BUCKET: documents
  RAG_CROSS_ENCODER_ENABLED: "false"
  RAG_WEB_SEARCH_ENABLED: "false"
  RAG_WEB_SEARCH_PROVIDER: tavily
  RAG_MULTI_QUERY_VARIATIONS: "3"
  ADMIN_EMAIL: admin@example.com

jobs:
  check-and-test:
    name: Lint, typecheck, security test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint + typecheck — no environment variables required.
      - name: npm run check (lint + typecheck)
        run: npm run check

      # 180+ unit/integration tests covering rate limiting, CSRF, prompt
      # injection, output filtering, ingestion auth, tenant scoping, upload
      # validation, etc. — no environment variables required.
      - name: npm run test:security
        run: npm run test:security

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm run build
        run: npm run build
        env:
          NODE_ENV: production

  infra-env-schema:
    name: Env var schema validation (advisory contract check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # scripts/infrastructure/validate-env.mjs was never wired into any
      # automated check prior to this workflow — it only ran if a developer
      # remembered to invoke "npm run infra:check-env*" by hand. Running it
      # here against the same placeholder set used above keeps the required-key
      # list validated on every PR without requiring real secrets in CI.
      - name: infra:check-env (web target)
        run: node scripts/infrastructure/validate-env.mjs --target web
        env:
          NODE_ENV: production
